# yaml-language-server: $schema=./requirements.schema.json
# Compact requirements. Spec: FORMAT.md. Project vocabulary: requirements.vocab.md.
# One requirement per line: "<capability> — so that <value> — acceptance: <observable proof>."

functional:
  accounts:
    As a user, I can:
      ACC-01: "reset my password from a signed email link — so that a lost password is recoverable without contacting support — acceptance: a used or expired link is rejected and a freshly issued link succeeds."
      ACC-02: "sign in with a one-time code — so that I do not have to remember a password — acceptance: an entered valid code within its window authenticates and an expired code does not."
    As an admin, I can:
      ACC-03: "revoke another user's active sessions — so that a compromised account can be locked out immediately — acceptance: after revocation the target's next request is unauthenticated."

non_functional:
  security:
    SEC-01: "public endpoints are rate-limited — so that credential stuffing and abuse are constrained — acceptance: repeated abusive requests from one source receive throttled responses."
  performance:
    PERF-01: "list views respond within a documented budget under expected load — so that the app stays usable at scale — acceptance: the p95 list-view latency meets the stated budget in a load test."

deferred:
  payments:
    "[deferred] PAY-01": "users can pay online through a hosted checkout — so that paid plans are possible later — acceptance: funds settle without the platform holding balances."
