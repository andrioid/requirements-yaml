# requirements-yaml — one line per requirement, edit by hand.
# line:   <ID>: observable capability; so that value.
# groups: functional(area -> "As a <role>, I can:" -> ID) · non_functional & domain sections(group -> ID) · deferred(area -> "[deferred] ID")
# ids:    PREFIX-NN, uppercase, stable, never reused.
# docs:   optional map (kept at the file's end) of <filename> -> description of what it is and when to read it.
# goals/non_goals: optional lists, kept first — one distilled line each, not requirements: no IDs, no clauses.
# roles:  optional map (kept before functional) of <role> -> who they are; names match the "As a <role>" headings.
# yaml-language-server: $schema=./requirements.schema.json
goals:
  - account recovery never depends on contacting human support.
  - a user is never forced to remember a shared secret to stay secure.

non_goals:
  - never a payments processor that holds customer balances.
  - not a multi-tenant SaaS; a deployment serves one organization.

roles:
  user: an authenticated account holder acting on their own data.
  admin: an operator who can act across all users — the system's highest trust level.

functional:
  accounts:
    As a user, I can:
      ACC-01: regain account access after losing my sign-in credential; so that I can recover without contacting support.
      ACC-02: sign in without remembering a reusable secret; so that I can avoid relying on a password.
    As an admin, I can:
      ACC-03: revoke another user's access; so that I can protect a compromised account.

non_functional:
  security:
    SEC-01: public access resists automated abuse; so that accounts and service availability are protected.
  performance:
    PERF-01: list views remain responsive as usage grows; so that the app stays usable at scale.

deferred:
  payments:
    "[deferred] PAY-01": users can pay online without the platform holding their balance; so that paid plans are possible later.

# docs is optional — supporting documents and when to read them, kept at the end.
docs:
  docs/glossary.md: the ubiquitous language — read before naming anything in a requirement.
  docs/domain-model.md: aggregates, entities, and invariants — read before adding or changing a functional area.
